name: Jolly
description: >-
  Jolly is an AI-powered workforce engagement platform that uses a points-based
  rewards system, gamification, and performance-based incentives to drive
  engagement, utilization, compliance, and recruitment for frontline and
  part-time workforces. Employees earn points by completing work-related
  missions (taking shifts, arriving on time, hitting productivity goals) and
  redeem them for real-world rewards from partners such as Walmart, Amazon, and
  Visa. Employers use an AI campaign builder, programmatic employee referrals, an
  internal social recognition platform, real-time analytics (flight-risk
  detection, employee NPS, engagement metrics via ERP/EMR integrations), and
  white-label branding. Jolly serves healthcare, logistics, manufacturing,
  staffing, farming, retail, warehousing, construction, and military employers.
  Based at Cornell Tech in New York City, the company raised a $16.5M Series A
  and is backed by Bullpen Capital along with executives from Tesla, Coinbase,
  Stripe, PayPal, and Discord. Jolly does not currently publish a public
  developer API, SDKs, or documentation surface; this profile captures its
  public identity and domain-security posture.
